<header class="navbar navbar-expand-lg border-bottom border-secondary px-4 py-3">
  <div class="container-fluid">

    <a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center gap-2">
      <i class="bi bi-check2-square text-primary fs-3"></i>
      <span class="fw-bold">KaksFlow</span>
    </a>

    <div class="d-flex align-items-center gap-3">
      {% if user.is_authenticated %}
        <div class="text-end">
          <div class="fw-semibold">{{ user.username }}</div>
          <small class="text-secondary">Minha conta</small>
        </div>

        <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center"
             style="width: 38px; height: 38px;">
          <i class="bi bi-person-fill text-white"></i>
        </div>
      {% endif %}
    </div>

  </div>
</header>
